[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kabir"
description = "کبیر — نرم‌افزار تحت وب محاسبه‌ی قیمت تمام‌شده و صدور فاکتور صنعت کابینت"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kabir Team" }]
keywords = ["cabinet", "costing", "invoice", "persian", "rtl", "sqlite"]
dynamic = ["version"]
dependencies = [
    "reportlab>=4.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/erfanjaster/kabir_app"

[project.scripts]
kabir = "kabir.web.server:main"

[tool.setuptools]
packages = ["kabir", "kabir.core", "kabir.data", "kabir.web"]
include-package-data = true

[tool.setuptools.package-data]
kabir = ["../webui/**/*", "../assets/**/*"]

[tool.setuptools.dynamic]
version = { attr = "kabir.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
